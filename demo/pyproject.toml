[project]
name = "d3a-autoresearch-demo"
version = "0.1.0"
description = "Autoresearch demo: an agent improves a censored Bayesian regression of ciprofloxacin MIC"
requires-python = ">=3.12"
dependencies = [
    "numpyro==0.22.0",
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "arviz==1.3.0",
    "h5netcdf>=1.4",
    "h5py>=3.11",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[dependency-groups]
tracking = [
    "wandb==0.30.0",
    "weave==0.53.11",
]
